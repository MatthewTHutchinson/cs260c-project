env:
  ctrl_freq: 20
  pyb_freq: 240
  clip_radius_start: 0.25
  clip_radius_end: 0.5
  max_dyaw: 0.3
  episode_len_sec: 30.0
  history_len: 3
  smooth_coef: 0.01
  progress_coef: 0.1
  track_names:
    - rect_default
    - rect_wide
    - rect_tall
    - rect_skew
  sample_track_on_reset: true

validation_env:
  ctrl_freq: 20
  pyb_freq: 240
  clip_radius_start: 0.25
  clip_radius_end: 0.5
  max_dyaw: 0.3
  episode_len_sec: 30.0
  history_len: 3
  smooth_coef: 0.01
  progress_coef: 0.1
  track_names:
    - heldout_diamond
    - heldout_tilted
  sample_track_on_reset: true

policy:
  obs_dim: 36
  action_dim: 4
  hidden: [256, 256]

bc:
  n_expert_episodes: 50
  n_epochs: 200
  lr: 3.0e-4
  batch_size: 256

dagger:
  n_rounds: 10
  n_rollout_episodes: 10
  n_epochs: 50
  lr: 3.0e-4
  batch_size: 256

ppo:
  n_steps: 2048
  n_epochs: 10
  batch_size: 64
  lr: 1.0e-4
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.001
  vf_coef: 0.5
  bc_coef: 0.25
  max_grad_norm: 0.5
  init_log_std: -2.0
  target_kl: 0.03
  min_updates_before_clip_relax: 8
  validation_interval_updates: 5
  validation_episodes: 12
  validation_seed: 1234
  checkpoint_interval_updates: 5
  total_timesteps: 300000
  clip_schedule:
    - [0,      0.25]
    - [150000, 0.35]
    - [250000, 0.5]
