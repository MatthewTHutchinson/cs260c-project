env:
  ctrl_freq: 20
  pyb_freq: 240
  clip_radius_start: 0.25
  clip_radius_end: 0.5
  max_dyaw: 0.3
  episode_len_sec: 35.0
  history_len: 3
  lookahead_gates: 3
  include_gate_normals: true
  include_relative_heading: true
  observation_source: state
  smooth_coef: 0.01
  progress_coef: 0.1
  track_names:
    - rect_default
  sample_track_on_reset: false
  camera:
    enabled: true
    width: 128
    height: 96
    fov: 85.0
    tilt_deg: 8.0
    offset_forward: 0.08
    offset_up: 0.03
    noise_std: 2.5
    exposure_jitter: 0.10
    occlusion_prob: 0.10
    occlusion_count: 1
    shadow: true
  visual:
    enabled: true
    randomize: true
    clutter_count: 12

