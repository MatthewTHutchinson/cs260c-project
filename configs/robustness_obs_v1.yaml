env:
  ctrl_freq: 20
  pyb_freq: 240
  clip_radius_start: 0.25
  clip_radius_end: 0.5
  max_dyaw: 0.3
  episode_len_sec: 30.0
  history_len: 3
  lookahead_gates: 3
  include_gate_normals: true
  include_relative_heading: true
  smooth_coef: 0.01
  progress_coef: 0.1
  track_names:
    - rect_default
  sample_track_on_reset: false
  start_distance: 3.0
  start_longitudinal_jitter: 0.45
  start_lateral_jitter: 0.50
  start_vertical_jitter: 0.25
  start_yaw_jitter: 0.40

validation_suites:
  - name: easy
    env:
      ctrl_freq: 20
      pyb_freq: 240
      clip_radius_start: 0.25
      clip_radius_end: 0.5
      max_dyaw: 0.3
      episode_len_sec: 30.0
      history_len: 3
      lookahead_gates: 3
      include_gate_normals: true
      include_relative_heading: true
      smooth_coef: 0.01
      progress_coef: 0.1
      track_names:
        - heldout_diamond
        - heldout_tilted
      sample_track_on_reset: true
      start_distance: 3.0
      start_longitudinal_jitter: 0.45
      start_lateral_jitter: 0.50
      start_vertical_jitter: 0.25
      start_yaw_jitter: 0.40
  - name: hard_core
    env:
      ctrl_freq: 20
      pyb_freq: 240
      clip_radius_start: 0.25
      clip_radius_end: 0.5
      max_dyaw: 0.3
      episode_len_sec: 30.0
      history_len: 3
      lookahead_gates: 3
      include_gate_normals: true
      include_relative_heading: true
      smooth_coef: 0.01
      progress_coef: 0.1
      track_names:
        - heldout_diamond
        - heldout_tilted
        - heldout_pinched
        - heldout_lowhigh
      sample_track_on_reset: true
      start_distance: 3.0
      start_longitudinal_jitter: 0.45
      start_lateral_jitter: 0.50
      start_vertical_jitter: 0.25
      start_yaw_jitter: 0.40
  - name: hard_zigzag
    env:
      ctrl_freq: 20
      pyb_freq: 240
      clip_radius_start: 0.25
      clip_radius_end: 0.5
      max_dyaw: 0.3
      episode_len_sec: 30.0
      history_len: 3
      lookahead_gates: 3
      include_gate_normals: true
      include_relative_heading: true
      smooth_coef: 0.01
      progress_coef: 0.1
      track_names:
        - heldout_zigzag
      sample_track_on_reset: true
      start_distance: 3.0
      start_longitudinal_jitter: 0.45
      start_lateral_jitter: 0.55
      start_vertical_jitter: 0.25
      start_yaw_jitter: 0.45

policy:
  obs_dim: 78
  action_dim: 4
  hidden: [256, 256]

ppo:
  init_log_std: -2.0

robustness_audit:
  episodes: 60
  scenarios:
    - name: nominal_easy
      suite_name: easy
    - name: nominal_hard_core
      suite_name: hard_core
    - name: nominal_hard_zigzag
      suite_name: hard_zigzag
    - name: stress_start_pose
      suite_name: hard_core
      env_overrides:
        start_longitudinal_jitter: 0.90
        start_lateral_jitter: 0.95
        start_vertical_jitter: 0.45
        start_yaw_jitter: 0.80
    - name: stress_obs_noise_light
      suite_name: hard_core
      obs_noise_std: 0.02
    - name: stress_obs_noise_heavy
      suite_name: hard_core
      obs_noise_std: 0.05
    - name: stress_action_noise
      suite_name: hard_core
      action_noise_std: 0.04
    - name: stress_disturbance
      suite_name: hard_core
      env_overrides:
        disturbance_force_std: 0.03
        disturbance_torque_std: 0.002
    - name: ood_vertical
      track_names:
        - audit_vertical_ladder
        - audit_drop_recover
      env_overrides:
        start_longitudinal_jitter: 0.60
        start_lateral_jitter: 0.70
        start_vertical_jitter: 0.40
        start_yaw_jitter: 0.55
    - name: ood_switchback
      track_names:
        - audit_sharp_switchback
        - audit_offset_spike
      env_overrides:
        start_longitudinal_jitter: 0.60
        start_lateral_jitter: 0.75
        start_vertical_jitter: 0.35
        start_yaw_jitter: 0.60
