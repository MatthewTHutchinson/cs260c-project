<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="720" viewBox="0 0 1400 720">
  <rect width="1400" height="720" fill="#f8f6ef"/>

  <rect x="150" y="92" width="1100" height="496" rx="18" fill="#ffffff" stroke="#d1c8b7" stroke-width="2"/>
  <rect x="150" y="92" width="1100" height="92" rx="18" fill="#244d63"/>
  <rect x="150" y="150" width="1100" height="34" fill="#244d63"/>

  <line x1="150" y1="184" x2="1250" y2="184" stroke="#d1c8b7" stroke-width="2"/>
  <line x1="150" y1="318" x2="1250" y2="318" stroke="#ded7c8" stroke-width="2"/>
  <line x1="150" y1="452" x2="1250" y2="452" stroke="#ded7c8" stroke-width="2"/>
  <line x1="500" y1="92" x2="500" y2="588" stroke="#ded7c8" stroke-width="2"/>
  <line x1="825" y1="92" x2="825" y2="588" stroke="#ded7c8" stroke-width="2"/>
  <line x1="1050" y1="92" x2="1050" y2="588" stroke="#ded7c8" stroke-width="2"/>

  <text x="325" y="150" text-anchor="middle" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="25" font-weight="700" fill="#ffffff">Model</text>
  <text x="662.5" y="150" text-anchor="middle" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="25" font-weight="700" fill="#ffffff">Hard return</text>
  <text x="937.5" y="150" text-anchor="middle" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="25" font-weight="700" fill="#ffffff">Completion</text>
  <text x="1150" y="150" text-anchor="middle" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="25" font-weight="700" fill="#ffffff">Crashes</text>

  <text x="325" y="259" text-anchor="middle" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="27" fill="#29383c">Earlier PPO</text>
  <text x="662.5" y="259" text-anchor="middle" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#6d6f70">71.68</text>
  <text x="937.5" y="259" text-anchor="middle" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="28" fill="#6d6f70">lower</text>
  <text x="1150" y="259" text-anchor="middle" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="28" fill="#6d6f70">higher</text>

  <rect x="176" y="344" width="1048" height="82" rx="12" fill="#edf4ef" stroke="#aac5b2" stroke-width="2"/>
  <text x="325" y="397" text-anchor="middle" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="27" font-weight="700" fill="#26382d">Richer-observation PPO</text>
  <text x="662.5" y="397" text-anchor="middle" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="38" font-weight="800" fill="#2e6b48">82.49</text>
  <text x="937.5" y="397" text-anchor="middle" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="36" font-weight="800" fill="#2e6b48">99%</text>
  <text x="1150" y="397" text-anchor="middle" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="36" font-weight="800" fill="#2e6b48">0%</text>

  <text x="325" y="530" text-anchor="middle" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="27" fill="#29383c">Easy held-out suite</text>
  <text x="662.5" y="530" text-anchor="middle" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#2e6b48">82.95</text>
  <text x="937.5" y="530" text-anchor="middle" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#2e6b48">100%</text>
  <text x="1150" y="530" text-anchor="middle" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="30" fill="#2e6b48">stable</text>

  <text x="700" y="656" text-anchor="middle" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="25" font-weight="700" fill="#26353a">The main improvement was representation, not just more training.</text>
  <text x="700" y="690" text-anchor="middle" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="20" fill="#526166">Three-gate lookahead + gate normals + relative heading to the gate plane.</text>
