<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="720" viewBox="0 0 1400 720">
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#244d63"/>
    </marker>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000000" flood-opacity="0.14"/>
    </filter>
  </defs>
  <rect width="1400" height="720" fill="#f7f4eb"/>
  <text x="80" y="96" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="42" font-weight="700" fill="#1e2b2f">System architecture</text>
  <text x="82" y="135" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="22" fill="#56656b">Current simulator stack: stable local waypoint control, not final competition runtime.</text>

  <g filter="url(#softShadow)">
    <rect x="80" y="240" width="235" height="150" rx="10" fill="#ffffff" stroke="#d2c9b6" stroke-width="2"/>
    <text x="198" y="292" text-anchor="middle" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#243034">Observation</text>
    <text x="198" y="328" text-anchor="middle" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="18" fill="#5d686c">78D state</text>
    <text x="198" y="356" text-anchor="middle" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="18" fill="#5d686c">gate geometry</text>
  </g>

  <g filter="url(#softShadow)">
    <rect x="405" y="240" width="235" height="150" rx="10" fill="#ffffff" stroke="#d2c9b6" stroke-width="2"/>
    <text x="522" y="292" text-anchor="middle" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#243034">Policy</text>
    <text x="522" y="328" text-anchor="middle" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="18" fill="#5d686c">MLP or</text>
    <text x="522" y="356" text-anchor="middle" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="18" fill="#5d686c">state+vision CNN</text>
  </g>

  <g filter="url(#softShadow)">
    <rect x="730" y="240" width="250" height="150" rx="10" fill="#ffffff" stroke="#d2c9b6" stroke-width="2"/>
    <text x="855" y="292" text-anchor="middle" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#243034">Action</text>
    <text x="855" y="328" text-anchor="middle" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="18" fill="#5d686c">body-frame waypoint</text>
    <text x="855" y="356" text-anchor="middle" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="18" fill="#5d686c">delta + yaw</text>
  </g>

  <g filter="url(#softShadow)">
    <rect x="1070" y="240" width="250" height="150" rx="10" fill="#ffffff" stroke="#d2c9b6" stroke-width="2"/>
    <text x="1195" y="292" text-anchor="middle" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#243034">PID + Drone</text>
    <text x="1195" y="328" text-anchor="middle" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="18" fill="#5d686c">tracks local target</text>
    <text x="1195" y="356" text-anchor="middle" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="18" fill="#5d686c">in PyBullet</text>
  </g>

  <path d="M315 315 H385" stroke="#244d63" stroke-width="5" marker-end="url(#arrow)"/>
  <path d="M640 315 H710" stroke="#244d63" stroke-width="5" marker-end="url(#arrow)"/>
  <path d="M980 315 H1050" stroke="#244d63" stroke-width="5" marker-end="url(#arrow)"/>

  <rect x="160" y="505" width="1080" height="92" rx="14" fill="#e7efe9" stroke="#9bb8a4" stroke-width="2"/>
  <text x="700" y="548" text-anchor="middle" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#1f4030">Competition direction</text>
  <text x="700" y="580" text-anchor="middle" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="20" fill="#3e574a">Map policy outputs into MAVLink position / velocity / attitude setpoints.</text>
</svg>
