<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="720" viewBox="0 0 1400 720">
  <rect width="1400" height="720" fill="#f8f6ef"/>
  <text x="90" y="96" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="42" font-weight="700" fill="#1f2d31">What the harder audit exposed</text>
  <text x="92" y="136" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="22" fill="#59666a">Strong held-out performance did not mean broad racing robustness.</text>

  <rect x="110" y="220" width="350" height="300" rx="12" fill="#edf4ef" stroke="#a8c4b0" stroke-width="2"/>
  <text x="285" y="282" text-anchor="middle" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#294532">Strong</text>
  <text x="285" y="335" text-anchor="middle" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="22" fill="#40584a">Original held-out</text>
  <text x="285" y="368" text-anchor="middle" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="22" fill="#40584a">track family</text>
  <text x="285" y="438" text-anchor="middle" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="42" font-weight="800" fill="#2e6b48">99-100%</text>
  <text x="285" y="476" text-anchor="middle" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="20" fill="#40584a">completion range</text>

  <rect x="525" y="220" width="350" height="300" rx="12" fill="#fff4e5" stroke="#d3b16f" stroke-width="2"/>
  <text x="700" y="282" text-anchor="middle" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#604216">Weaker</text>
  <text x="700" y="335" text-anchor="middle" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="22" fill="#6d5630">Mirrored /</text>
  <text x="700" y="368" text-anchor="middle" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="22" fill="#6d5630">right-turn tracks</text>
  <text x="700" y="438" text-anchor="middle" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="42" font-weight="800" fill="#99651e">75%</text>
  <text x="700" y="476" text-anchor="middle" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="20" fill="#6d5630">heldout_right_lowhigh</text>

  <rect x="940" y="220" width="350" height="300" rx="12" fill="#f7e8e5" stroke="#c89589" stroke-width="2"/>
  <text x="1115" y="282" text-anchor="middle" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#693126">Failed</text>
  <text x="1115" y="335" text-anchor="middle" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="22" fill="#70483f">Most longer</text>
  <text x="1115" y="368" text-anchor="middle" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="22" fill="#70483f">six-gate tracks</text>
  <text x="1115" y="438" text-anchor="middle" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="42" font-weight="800" fill="#a33f31">0%</text>
  <text x="1115" y="476" text-anchor="middle" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="20" fill="#70483f">several long-course audits</text>

  <text x="700" y="624" text-anchor="middle" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#26353a">Takeaway: benchmark design mattered.</text>
  <text x="700" y="662" text-anchor="middle" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="21" fill="#526166">The project solved a meaningful simulator family, not general drone racing.</text>
</svg>
