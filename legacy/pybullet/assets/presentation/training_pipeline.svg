<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="720" viewBox="0 0 1400 720">
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#2b4f5f"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="7" stdDeviation="7" flood-color="#000000" flood-opacity="0.14"/>
    </filter>
  </defs>
  <rect width="1400" height="720" fill="#f8f6ef"/>
  <text x="80" y="96" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="42" font-weight="700" fill="#1f2d31">Training pipeline</text>
  <text x="82" y="135" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="22" fill="#59666a">Stable flight first, then reinforcement learning refinement.</text>

  <g filter="url(#shadow)">
    <rect x="95" y="255" width="245" height="145" rx="10" fill="#ffffff" stroke="#d0c6b2" stroke-width="2"/>
    <text x="218" y="307" text-anchor="middle" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#253239">Expert</text>
    <text x="218" y="342" text-anchor="middle" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="18" fill="#5e686d">geometric lookahead</text>
    <text x="218" y="370" text-anchor="middle" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="18" fill="#5e686d">not minimum snap</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="425" y="255" width="245" height="145" rx="10" fill="#ffffff" stroke="#d0c6b2" stroke-width="2"/>
    <text x="548" y="307" text-anchor="middle" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#253239">BC</text>
    <text x="548" y="342" text-anchor="middle" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="18" fill="#5e686d">imitate expert</text>
    <text x="548" y="370" text-anchor="middle" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="18" fill="#5e686d">stable prior</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="755" y="255" width="245" height="145" rx="10" fill="#ffffff" stroke="#d0c6b2" stroke-width="2"/>
    <text x="878" y="307" text-anchor="middle" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#253239">DAgger</text>
    <text x="878" y="342" text-anchor="middle" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="18" fill="#5e686d">label policy states</text>
    <text x="878" y="370" text-anchor="middle" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="18" fill="#5e686d">reduce drift</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1085" y="255" width="245" height="145" rx="10" fill="#ffffff" stroke="#d0c6b2" stroke-width="2"/>
    <text x="1208" y="307" text-anchor="middle" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#253239">PPO</text>
    <text x="1208" y="342" text-anchor="middle" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="18" fill="#5e686d">fine tune</text>
    <text x="1208" y="370" text-anchor="middle" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="18" fill="#5e686d">with BC regularizer</text>
  </g>

  <path d="M340 328 H405" stroke="#2b4f5f" stroke-width="5" marker-end="url(#arrow)"/>
  <path d="M670 328 H735" stroke="#2b4f5f" stroke-width="5" marker-end="url(#arrow)"/>
  <path d="M1000 328 H1065" stroke="#2b4f5f" stroke-width="5" marker-end="url(#arrow)"/>

  <rect x="160" y="505" width="1080" height="92" rx="14" fill="#e9eef2" stroke="#a5b8c5" stroke-width="2"/>
  <text x="700" y="548" text-anchor="middle" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#243b49">Why this mattered</text>
  <text x="700" y="580" text-anchor="middle" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="20" fill="#435966">Pure PPO was unstable; imitation gave PPO a useful flight prior.</text>
</svg>
