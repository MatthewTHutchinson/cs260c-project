env:
  ctrl_freq: 20
  pyb_freq: 240
  clip_radius_start: 0.25
  clip_radius_end: 0.5
  max_dyaw: 0.3
  episode_len_sec: 30.0
  history_len: 3
  lookahead_gates: 3
  include_gate_normals: true
  include_relative_heading: true
  smooth_coef: 0.01
  progress_coef: 0.1
  track_names:
    - rect_default
    - rect_narrow
    - rect_wide
    - rect_tall
    - rect_skew
    - rect_offset
    - rect_drop
    - rect_bow
    - rect_fast
    - train_zigzag_a
    - train_zigzag_b
    - train_switchback
    - train_zigzag_lowhigh
    - train_vertical_arc_a
    - train_vertical_arc_b
    - train_vertical_ladder_train
    - train_drop_recover_a
    - train_drop_recover_b
    - train_drop_recover_c
    - train_drop_recover_d
    - train_switchback_tight_a
    - train_switchback_tight_b
    - train_offset_recover
    - train_vertical_arc_a
    - train_vertical_ladder_train
    - train_drop_recover_a
    - train_drop_recover_b
    - train_drop_recover_c
    - train_drop_recover_d
    - train_offset_recover
    - train_zigzag_a
    - train_switchback_tight_a
  sample_track_on_reset: true
  start_distance: 3.0
  start_longitudinal_jitter: 0.58
  start_lateral_jitter: 0.68
  start_vertical_jitter: 0.40
  start_yaw_jitter: 0.52

