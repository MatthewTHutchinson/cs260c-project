env:
  ctrl_freq: 20
  pyb_freq: 240
  clip_radius_start: 0.25
  clip_radius_end: 0.5
  max_dyaw: 0.3
  episode_len_sec: 30.0
  history_len: 3
  lookahead_gates: 3
  include_gate_normals: true
  include_relative_heading: true
  observation_source: vision_bridge
  vision_bridge_fallback: cache_track
  vision_bridge_normal_source: track
  vision_bridge_min_confidence: 0.12
  smooth_coef: 0.01
  progress_coef: 0.1
  track_names:
    - heldout_diamond
    - heldout_tilted
    - heldout_pinched
    - heldout_lowhigh
    - heldout_zigzag
  sample_track_on_reset: true
  start_distance: 3.0
  start_longitudinal_jitter: 0.45
  start_lateral_jitter: 0.50
  start_vertical_jitter: 0.25
  start_yaw_jitter: 0.40
  camera:
    enabled: true
    width: 128
    height: 96
    fov: 85.0
    tilt_deg: 8.0
    offset_forward: 0.08
    offset_up: 0.03
    noise_std: 2.0
    exposure_jitter: 0.08
    occlusion_prob: 0.05
    occlusion_count: 1
    shadow: true
  visual:
    enabled: true
    randomize: true
    clutter_count: 10

