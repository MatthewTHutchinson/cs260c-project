policy:
  type: multimodal
  obs_dim: 78
  action_dim: 4
  hidden: [256, 256]
  image_shape: [3, 96, 128]
  image_feature_dim: 128
  image_channels: [32, 64, 64]

bc:
  n_expert_episodes: 80
  n_epochs: 200
  lr: 3.0e-4
  batch_size: 128

dagger:
  n_rounds: 12
  n_rollout_episodes: 12
  n_epochs: 50
  lr: 3.0e-4
  batch_size: 128

ppo:
  n_steps: 2048
  n_epochs: 10
  batch_size: 64
  lr: 1.0e-4
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.001
  vf_coef: 0.5
  bc_coef: 0.25
  max_grad_norm: 0.5
  init_log_std: -2.0
  target_kl: 0.03
  min_updates_before_clip_relax: 10
  validation_interval_updates: 5
  validation_episodes: 12
  validation_seed: 1234
  checkpoint_interval_updates: 5
  total_timesteps: 300000
  clip_schedule:
    - [0,      0.25]
    - [180000, 0.35]
    - [260000, 0.5]
